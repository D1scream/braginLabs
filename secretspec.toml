[project]
name = "fortune-pies"
revision = "1.0"

[providers]
local = "pass://"

[profiles.default]
PGPASSWORD = { description = "Optional password supplied by the environment", required = false, providers = ["env"] }

[profiles.development]
PGPASSWORD = { description = "Local development PostgreSQL password", required = true, providers = ["local"] }

[profiles.staging]
PGPASSWORD = { description = "Local staging PostgreSQL password", required = true, providers = ["local"] }

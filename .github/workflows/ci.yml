name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quality and tests
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: "true"
      SECRETSPEC_PROFILE: default
      SECRETSPEC_REASON: Validate the development environment in CI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure devenv binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Check formatting and static analysis
        run: devenv shell -- chk

      - name: Run Rust unit tests
        run: devenv shell -- cargo test --locked

  windows:
    name: Windows Rust tests
    runs-on: windows-2025
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked
      - run: cargo +stable test --locked --features lab6
